name: Peloton - Inspect 2026 Slovenia Men Elite start list
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-europeans-2026.yml'
      - 'europeans_2026_diagnostics.py'
permissions:
  contents: write
concurrency:
  group: peloton-europeans-diagnostics
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check official UEC and independent start-list HTML
        run: python europeans_2026_diagnostics.py
      - name: Save safe HTML structure diagnostics
        run: |
          git config user.name 'peloton-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/test-europeans-2026-diagnostics.json
          if ! git diff --staged --quiet; then
            git commit -m 'Record Europe 2026 start list HTML diagnostics [skip ci]'
            git push
          fi
