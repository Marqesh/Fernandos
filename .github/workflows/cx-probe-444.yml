name: Peloton CX - Inspect official PDF 444
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cx-probe-444.yml'
permissions:
  contents: write
concurrency:
  group: cx-probe-444
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cyclocross-2026-27
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r cyclocross/requirements.txt
      - name: Read and inspect source PDF (no production data changes)
        run: python cyclocross/pdf_probe_444.py
      - name: Verify document fetch and record diagnostics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("cyclocross/data/probe-444.json").read_text())
          print("PDF:",d.get("http_status"),d.get("header"),"rows:",d.get("unique_uci_ids",0))
          if d.get("error"): raise SystemExit(d["error"])
          PY
      - name: Commit isolated PDF inspection only
        run: |
          git config user.name peloton-data-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feature/cyclocross-2026-27
          git reset --mixed origin/feature/cyclocross-2026-27
          git add cyclocross/data/probe-444.json
          if ! git diff --staged --quiet; then
            git commit -m 'Inspect official cyclocross PDF 444 [skip ci]'
            git push origin HEAD:feature/cyclocross-2026-27
          fi
