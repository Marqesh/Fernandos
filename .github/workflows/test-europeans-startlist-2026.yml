name: Peloton - Test 2026 Slovenia Men Elite Startlist
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-europeans-startlist-2026.yml'
      - 'europeans_2026_startlist.py'
permissions:
  contents: write
concurrency:
  group: peloton-uec-startlist-test
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install PDF reader
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'pymupdf>=1.26,<2'
      - name: Check existing parser tests
        run: python -m pytest -q
      - name: Extract official UEC start list only
        continue-on-error: true
        run: python europeans_2026_startlist.py
      - name: Save test output and diagnostics
        run: |
          git config user.name 'peloton-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/test-europeans-2026-startlist.json data/test-europeans-2026-pdf-diagnostics.json
          if ! git diff --staged --quiet; then
            git commit -m 'Update UEC 2026 startlist PDF diagnostic [skip ci]'
            git push
          fi
      - name: Verify start-list extraction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/test-europeans-2026-startlist.json').read_text(encoding='utf-8'))
          print(p['status'],len(p.get('riders',[])),p.get('warning',''))
          assert p['status']=='published' and len(p['riders'])>=70
          PY
