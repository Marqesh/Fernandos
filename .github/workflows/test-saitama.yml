name: Peloton - Test Saitama 2026 rider list
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-saitama.yml'
      - 'scraper.py'
      - 'saitama_diagnostics.py'
      - 'test_races.json'
      - 'tests/test_saitama.py'
      - 'tests/fixtures/saitama_2026_sample.html'
permissions:
  contents: write
concurrency:
  group: peloton-test-saitama
  cancel-in-progress: false
jobs:
  check-saitama:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Run parser regression tests
        run: python -m pytest -q
      - name: Diagnose live official source
        run: python saitama_diagnostics.py
      - name: Generate independent Saitama test feed
        run: python scraper.py --config test_races.json --output data/test-saitama.json --force
      - name: Save test feed and diagnostics
        run: |
          git config user.name 'peloton-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/test-saitama.json data/test-saitama-diagnostics.json
          if ! git diff --staged --quiet; then
            git commit -m 'Update independent Saitama diagnostic [skip ci]'
            git push
          fi
      - name: Verify actual live rider extraction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          feed=json.loads(Path('data/test-saitama.json').read_text(encoding='utf-8'))
          race=feed['races'][0]
          roster=race['startlist']
          print(race['name'],roster['status'],len(roster.get('riders',[])),roster.get('warning',''))
          if roster['status']!='published' or len(roster.get('riders',[]))<5:
              raise SystemExit('Live rider roster NOT confirmed; inspect diagnostic JSON')
          PY
