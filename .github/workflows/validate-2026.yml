name: Peloton - Validate 2026 historical race startlists
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: peloton-2026-historical
  cancel-in-progress: false
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify production parser regression suite
        run: python -m pytest -q
      - name: Test 2026 archive startlists (never use production feed)
        run: python scraper.py --config races_2026.json --output data/history-2026.json --force
      - name: Record historical validation result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/history-2026.json').read_text())
          for r in d['races']:
              s=r['startlist']
              print(r['name'],r['year'],s['status'],len(s.get('riders',[])),s.get('warning',''))
          PY
      - name: Commit isolated history only
        run: |
          git config user.name 'peloton-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history-2026.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update independent 2026 historical validation [skip ci]'
            git push
          fi
