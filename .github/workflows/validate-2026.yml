name: Peloton - Validate all 30 official 2026 startlists
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-2026.yml'
      - 'startlists_2026.py'
      - 'races_2026.json'
      - 'races_2027_targets.json'
      - 'tests/test_startlists_2026.py'
permissions:
  contents: write
concurrency:
  group: peloton-historical-2026
  cancel-in-progress: false
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and regression tests
        run: python -m pytest -q
      - name: Test 2026 historical startlists (official sources only)
        run: |
          python startlists_2026.py --config races_2026.json \
             --output data/history-2026.json \
             --report data/history-2026-diagnostics.json --delay 0.7 --force
      - name: Build human-readable 30-race report
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('data/history-2026.json').read_text(encoding='utf-8'))
          out=['## 2026 startlists | historical validation','',
               'This workflow only reads public organiser sources. It does not import race results.','',
               '| Race | Date | Status | Riders |','|---|---|---|---:|']
          for race in data['races']:
              li=race['startlist']
              out.append(f"| {race['name'].replace('|','/')} | {race['start_date']} | {li['status']} | {li.get('count',0)} |")
          out.append('')
          out.append('**Important:** `unavailable` means that an official archive was not recoverable, not that no riders started.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('\n'.join(out)+'\n')
          print('Validated',sum(r['startlist']['status']=='published' for r in data['races']),'of',len(data['races']))
          PY
      - name: Save historical JSON and diagnostics only
        run: |
          git config user.name 'peloton-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A queued manual run can start from an older dispatch SHA. Move the
          # local index to the latest remote commit WITHOUT overwriting the
          # generated working-tree JSON files, then commit only our reports.
          git fetch origin main
          git reset --mixed origin/main
          git add data/history-2026.json data/history-2026-diagnostics.json
          if ! git diff --staged --quiet; then
            git commit -m 'Update 2026 historical startlist diagnostics [skip ci]'
            git push
          fi